<title>AlgoLens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar + one content column (max 1240px); views swap in place: Overview leaderboard → Strategy detail → Compare → Portfolio → Add. */
:root {
  --bg: #f3f5f7; --surface: #ffffff; --surface-2: #eef1f4; --line: #dde3e9; --line-2: #c9d2db;
  --fg: #142029; --fg-2: #4b5a66; --fg-3: #7b8994;
  --accent: #0e6f73; --accent-weak: #d8eced; --accent-fg: #ffffff;
  --gain: #12805c; --gain-weak: #dcf1e8; --loss: #c2412d; --loss-weak: #fbe4df; --warn: #a86a00; --warn-weak: #fbefd4;
  --c1: #0e6f73; --c2: #b05b14; --c3: #5b4bc4; --c4: #b0306a;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1519; --surface: #161e24; --surface-2: #1c262d; --line: #26323a; --line-2: #34434d;
  --fg: #e3eaef; --fg-2: #a3b1bb; --fg-3: #73838e;
  --accent: #4fb8b8; --accent-weak: #16393b; --accent-fg: #06201f;
  --gain: #3fbf8c; --gain-weak: #123428; --loss: #ef7a64; --loss-weak: #3c1c16; --warn: #e2a73c; --warn-weak: #3a2b0e;
  --c1: #4fb8b8; --c2: #e39a52; --c3: #9a8cf2; --c4: #e676a6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1519; --surface: #161e24; --surface-2: #1c262d; --line: #26323a; --line-2: #34434d;
  --fg: #e3eaef; --fg-2: #a3b1bb; --fg-3: #73838e;
  --accent: #4fb8b8; --accent-weak: #16393b; --accent-fg: #06201f;
  --gain: #3fbf8c; --gain-weak: #123428; --loss: #ef7a64; --loss-weak: #3c1c16; --warn: #e2a73c; --warn-weak: #3a2b0e;
  --c1: #4fb8b8; --c2: #e39a52; --c3: #9a8cf2; --c4: #e676a6; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.5 }
.num, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em }
.gain { color: var(--gain) } .loss { color: var(--loss) } .muted { color: var(--fg-2) } .faint { color: var(--fg-3) }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line) }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap }
.brand { display: flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; text-decoration: none; color: var(--fg) }
.brand svg { flex: none }
.nav { display: flex; gap: 2px; flex-wrap: wrap }
.nav a { padding: 6px 12px; border-radius: 999px; color: var(--fg-2); text-decoration: none; font-weight: 500 }
.nav a:hover { color: var(--fg); background: var(--surface-2) }
.nav a[aria-current="page"] { background: var(--fg); color: var(--bg) }
.sync { margin-left: auto; font-size: 12px; color: var(--fg-3); display: flex; align-items: center; gap: 6px }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gain); box-shadow: 0 0 0 3px var(--gain-weak) }

main { max-width: 1240px; margin: 0 auto; padding: 22px 16px 60px; display: grid; gap: 22px }
main > * { min-width: 0 }
.tablewrap table { min-width: max-content }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3.2vw, 34px); letter-spacing: -0.03em; line-height: 1.1; margin: 0; text-wrap: balance }
h2 { font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; margin: 0 }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--fg-3); font-weight: 600 }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap }
.head p { margin: 6px 0 0; color: var(--fg-2); max-width: 64ch }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0 }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 18px }

/* KPI strip: one bordered band, cells separated by rules */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden }
.kpi { padding: 14px 16px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0 }
.kpi .v { font-family: var(--mono); font-size: 21px; font-weight: 600; letter-spacing: -0.03em; margin-top: 4px; font-variant-numeric: tabular-nums }
.kpi .s { font-size: 12px; color: var(--fg-3); margin-top: 1px }

/* Controls */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.field { background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 10px; min-width: 0 }
.field:focus { outline: 2px solid var(--accent); outline-offset: -1px }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 8px; overflow: hidden; background: var(--surface) }
.seg button { border: 0; background: none; padding: 5px 11px; cursor: pointer; color: var(--fg-2); font-size: 13px }
.seg button + button { border-left: 1px solid var(--line) }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg) }
.btn { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-weight: 500 }
.btn:hover { border-color: var(--fg-3) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }

/* Leaderboard */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th { text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--fg-3); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface) }
th.n, td.n { text-align: right }
th button { all: unset; cursor: pointer }
th button:hover { color: var(--fg) }
th[aria-sort] button { color: var(--accent) }
td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap }
tbody tr:last-child td { border-bottom: 0 }
tbody tr.click { cursor: pointer }
tbody tr.click:hover td { background: var(--surface-2) }
.sname { font-weight: 600; color: var(--fg); max-width: 260px; overflow: hidden; text-overflow: ellipsis; display: block }
.screator { font-size: 12px; color: var(--fg-3) }
.chip { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line) }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 500 }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor }
.pill.live { color: var(--gain); background: var(--gain-weak) }
.pill.active { color: var(--accent); background: var(--accent-weak) }
.pill.paused { color: var(--warn); background: var(--warn-weak) }
.tag { font-size: 11px; color: var(--fg-3); border: 1px dashed var(--line-2); border-radius: 5px; padding: 0 5px; margin-left: 4px }
.rank { font-family: var(--mono); color: var(--fg-3); font-size: 12px }

/* Charts */
.chart { width: 100%; height: auto; display: block; overflow: visible }
.chart text { fill: var(--fg-3); font-family: var(--mono); font-size: 10.5px }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.chart .zero { stroke: var(--line-2); stroke-width: 1 }
.chartbox { position: relative }
.tip { position: absolute; pointer-events: none; background: var(--fg); color: var(--bg); font-family: var(--mono); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%); z-index: 3 }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--fg-2) }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle }

/* Heatmap */
.heat { border-collapse: separate; border-spacing: 3px; font-size: 12px; width: 100% }
.heat th { padding: 2px 4px; border: 0; text-align: center; font-size: 10.5px }
.heat th.y { text-align: left; color: var(--fg-2); font-family: var(--mono); font-size: 12px; text-transform: none; letter-spacing: 0 }
.heat td { padding: 7px 2px; text-align: center; border: 0; border-radius: 5px; font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 11.5px; min-width: 46px }
.heat td.tot { font-weight: 600; background: var(--surface-2) }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); column-gap: 28px }
.stats div { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dotted var(--line-2); font-size: 13px }
.stats dt { color: var(--fg-2) } .stats dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right }

.back { color: var(--fg-2); text-decoration: none; font-size: 13px }
.back:hover { color: var(--accent) }
.meta-line { display: flex; flex-wrap: wrap; gap: 8px 16px; color: var(--fg-2); font-size: 13px; margin-top: 8px; align-items: center }

.pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 8px }
.pick label { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; min-width: 0 }
.pick label:has(input:checked) { border-color: var(--accent); background: var(--accent-weak) }
.pick .pn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0 }
.pick input[type=number] { width: 58px; text-align: right }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none }

.note { font-size: 12.5px; color: var(--fg-2); background: var(--surface-2); border-radius: 8px; padding: 10px 12px; line-height: 1.55 }
.corr td { text-align: center; font-family: var(--mono); font-size: 12px; min-width: 56px }
.steps { display: grid; gap: 12px; counter-reset: s; padding: 0; margin: 0; list-style: none }
.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s }
.steps li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); font-weight: 600; display: grid; place-items: center; font-size: 12px }
.queue li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px }
.srcseg button { padding: 5px 12px }
.srcseg .cnt { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 4px }
.src { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 1px }
.src.own { background: var(--accent-weak); color: var(--accent) }
.src.shared { background: var(--surface-2); color: var(--fg-2); border: 1px solid var(--line) }
.type { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; border: 1px solid currentColor; color: var(--loss) }
.type.off { color: var(--fg-3) }
.dash td { vertical-align: top }
.dash tr.main td { padding-top: 12px; padding-bottom: 12px }
.dash tr.main.open td { border-bottom-color: transparent }
.dash .sub { font-size: 12px; color: var(--fg-3); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap }
.posrow td { background: var(--surface-2); padding: 0 12px 12px }
.postable { width: 100%; font-size: 12.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.postable th { background: var(--surface); padding: 7px 10px } .postable td { padding: 6px 10px }
.postable tr.closed td { color: var(--fg-3) }
.chev { display: inline-block; width: 14px; color: var(--fg-3); transition: transform .15s }
tr.open .chev { transform: rotate(90deg) }
.links a { color: var(--accent); text-decoration: none; font-size: 12px; margin-right: 12px }
.links a:hover { text-decoration: underline }
.colpick { position: relative }
.colpick-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; min-width: 210px; box-shadow: 0 8px 24px rgb(0 0 0 / .12) }
.colpick-menu label { display: flex; gap: 8px; align-items: center; cursor: pointer; white-space: nowrap }
.statchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px }
.statchips button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; color: var(--fg-2) }
.statchips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg) }
.updated { font-size: 12px; color: var(--fg-3); display: flex; align-items: center; gap: 6px }
/* live pages */
#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; max-width: min(92vw, 520px); font-size: 13px; box-shadow: 0 8px 24px rgb(0 0 0 / .2) }
#toast.bad { background: var(--loss); color: #fff }
.goto { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }
.goto a { font-size: 13px; color: var(--fg-2); text-decoration: none; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line) }
.goto a:hover { color: var(--accent); border-color: var(--accent) }
details.panel > summary { list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer }
details.panel > summary::-webkit-details-marker { display: none }
details.panel > summary h2::before { content: "▸ "; color: var(--fg-3) }
details.panel[open] > summary h2::before { content: "▾ " }
.xchip { font-family: var(--mono); font-size: 10.5px; font-weight: 600; padding: 1px 5px; border-radius: 4px; background: var(--accent-weak); color: var(--accent); margin-right: 3px }
.schip { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--gain-weak); color: var(--gain) }
.schip.pos { background: color-mix(in srgb, var(--c3) 16%, var(--surface)); color: var(--c3) }
.mchip { font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--fg-2) }
.capchip { font-family: var(--mono); font-size: 11.5px; font-weight: 600; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2) }
.ppill { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--fg-2) }
.ppill.g { background: var(--gain-weak); color: var(--gain) } .ppill.l { background: var(--loss-weak); color: var(--loss) }
.ddbar { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden } .ddbar span { display: block; height: 100% }
.ddtxt { font-family: var(--mono); font-size: 11px; color: var(--fg-3); margin-top: 4px }
.copy { all: unset; cursor: pointer; color: var(--accent); font-size: 12px; text-decoration: underline dotted }
.copy:focus-visible { outline: 2px solid var(--accent) }
.dash tfoot td { border-top: 2px solid var(--accent); background: var(--surface-2); padding-top: 12px; padding-bottom: 12px }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 268px), 1fr)); gap: 14px }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.scard .chips { display: flex; gap: 5px; align-items: center; flex-wrap: wrap } .grow { flex: 1 }
.scard h3 { margin: 0; font-size: 15px; font-family: var(--display); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.scard h3 a { color: inherit; text-decoration: none } .scard h3 a:hover { color: var(--accent) }
.pnlbox { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; background: var(--surface-2); border-radius: 9px; padding: 10px 12px }
.pnlbox .big { font-family: var(--mono); font-size: 20px; font-weight: 700; letter-spacing: -0.03em }
.cardfoot { display: flex; align-items: center; gap: 10px; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 8px }
.cardfoot .ids { font-size: 11.5px; line-height: 1.5; min-width: 0 }
.stline { display: flex; justify-content: space-between; align-items: center }
.scard.removed { border-color: var(--loss); opacity: .85 } .scard.removed .banner { background: var(--loss); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; margin: -14px -14px 4px; padding: 6px 12px; border-radius: 11px 11px 0 0 }
.sw { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-2); cursor: pointer; user-select: none }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px }
.sw > span:first-of-type { width: 30px; height: 17px; border-radius: 9px; background: var(--line-2); position: relative; transition: background .15s; flex: none }
.sw > span:first-of-type::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: transform .15s }
.sw input:checked + span { background: var(--gain) } .sw.err input:checked + span { background: var(--loss) }
.sw input:checked + span::after { transform: translateX(13px) }
.sw input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px }
.sw input:disabled + span { opacity: .5 }
.sw.big > span:first-of-type { width: 40px; height: 22px; border-radius: 11px } .sw.big > span:first-of-type::after { width: 18px; height: 18px } .sw.big input:checked + span::after { transform: translateX(18px) }
.sw.big input:checked + span { background: var(--accent) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0) }
.setrow { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.setrow.col { flex-direction: column; align-items: flex-start } .setrow:last-child { border-bottom: 0 }
.setrow > div:first-child { flex: 1; min-width: 200px } .setrow p { margin: 2px 0 0; color: var(--fg-3); font-size: 12.5px }
.meter { height: 5px; border-radius: 3px; background: var(--surface-2); margin-top: 10px; overflow: hidden } .meter span { display: block; height: 100%; background: var(--accent) }
.fmtpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 6px }
.fmt { border: 1px solid var(--line-2); border-radius: 10px; padding: 12px; cursor: pointer; display: grid; gap: 6px; font-size: 12.5px }
.fmt input { position: absolute; opacity: 0 } .fmt:has(input:checked) { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-weak) }
.fmt:has(input:focus-visible) { outline: 2px solid var(--accent) }
.fmt pre { margin: 0; font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); padding: 8px; border-radius: 6px; white-space: pre-wrap }
.tgbubble { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); border: 1px solid var(--line); border-radius: 12px 12px 12px 4px; padding: 12px 14px; font-size: 13px; line-height: 1.55; max-height: 420px; overflow: auto; overflow-wrap: anywhere }
.tgbubble a { color: var(--accent) }
.mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px }
.minicard { all: unset; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; cursor: pointer; background: var(--surface); font-size: 12.5px; min-width: 0 }
.minicard b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap } .minicard .chips { display: flex; gap: 4px; flex-wrap: wrap }
.minicard .tagon { font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--fg-3) }
.minicard.on { border-color: color-mix(in srgb, var(--gain) 45%, var(--line)) } .minicard.on .tagon { background: var(--gain-weak); color: var(--gain) }

<script>/*ENGINE*/</script>
<script>
const META = /*META*/;
const EQ = /*EQ*/;
const SYNCED = "/*SYNCED*/";
let SYNC = /*SYNC*/;
let LIVE = /*LIVE*/;
let INTRADAY = /*INTRADAY*/;
const CONFIG = /*CONFIG*/;
</script>
<script>
(() => {
const A = window.AlgoLens;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const COLORS = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c4)'];

// ---------- formatting ----------
const inr = (v, d = 0) => (v < 0 ? '−' : '') + '₹' + Math.abs(v).toLocaleString('en-IN', { maximumFractionDigits: d });
function inrC(v) { // compact Indian units
  const a = Math.abs(v), s = v < 0 ? '−' : '';
  if (a >= 1e7) return s + '₹' + (a / 1e7).toFixed(2) + ' Cr';
  if (a >= 1e5) return s + '₹' + (a / 1e5).toFixed(2) + ' L';
  if (a >= 1e3) return s + '₹' + (a / 1e3).toFixed(1) + 'K';
  return s + '₹' + Math.round(a);
}
const pct = (v, d = 1) => v == null || !isFinite(v) ? '—' : (v < 0 ? '−' : '') + Math.abs(v).toFixed(d) + '%';
const sgnCls = (v) => v > 0 ? 'gain' : v < 0 ? 'loss' : '';
const fdate = (s) => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${+d} ${MON[m - 1]} ${y}`; };
const fnum = (v, d = 2) => v == null || !isFinite(v) ? '—' : v.toFixed(d);
function statusPill(s) { const k = /live/i.test(s) ? 'live' : /paus/i.test(s) ? 'paused' : 'active'; return `<span class="pill ${k}">${esc(s)}</span>`; }

// ---------- data ----------
let pref = {}; try { pref = JSON.parse(localStorage.getItem('algolens') || '{}'); } catch (e) {}
const save = () => { try { localStorage.setItem('algolens', JSON.stringify(pref)); } catch (e) {} };
const srcOf = (x) => x.source || 'shared';
const ALL = META.filter((m) => EQ[m.id] && EQ[m.id].length).map((m, i) => ({ ...m, source: srcOf(m), series: EQ[m.id], r: A.analyze(EQ[m.id], m.cap), idx: i }));
const byId = Object.fromEntries(ALL.map((s) => [s.id, s]));
let S = ALL;
const srcMatch = (x) => (pref.src || 'all') === 'all' || srcOf(x) === pref.src;
function applySource() { S = ALL.filter(srcMatch); }
function drawSrcSeg() {
  const pool = LIVE.items.length ? LIVE.items : ALL;
  const n = { all: pool.length, own: pool.filter((x) => srcOf(x) === 'own').length, shared: pool.filter((x) => srcOf(x) === 'shared').length };
  $('#srcSeg').innerHTML = [['all', 'All'], ['own', 'Mine'], ['shared', 'Shared']].map(([k, t]) => `<button data-src="${k}" aria-pressed="${(pref.src || 'all') === k}">${t}<span class="cnt">${n[k]}</span></button>`).join('');
}
const hm = (iso) => iso ? new Date(iso).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }) : '';
function drawSyncTxt() {

  $('#syncDot').style.background = bad ? 'var(--loss)' : 'var(--gain)';
  $('#syncTxt').textContent = bad ? (SYNC.authExpired ? 'Tradetron session expired' : 'Last sync failed') : (LIVE.fetchedAt ? 'Live ' + hm(LIVE.fetchedAt) + ' · ' : '') + 'History to ' + fdate(SYNCED);
}
applySource(); drawSrcSeg(); drawSyncTxt();
$('#srcSeg').addEventListener('click', (e) => { const b = e.target.closest('button[data-src]'); if (!b) return; pref.src = b.dataset.src; save(); applySource(); drawSrcSeg(); route(true); });

// ---------- charts (SVG) ----------
function scale(d0, d1, r0, r1) { const k = d1 === d0 ? 0 : (r1 - r0) / (d1 - d0); return (v) => r0 + (v - d0) * k; }
function niceTicks(min, max, n = 5) {
  const span = max - min || Math.abs(max) || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= step0);
  const t = []; for (let v = Math.ceil(min / step) * step; v <= max + step * 1e-9; v += step) t.push(+v.toFixed(10));
  return t;
}
let uid = 0;
/* lines: [{values:[...], color, fill?}] over shared x labels (dates) */
function lineChart({ dates, lines, h = 260, fmt = inrC, area = true, zero = true, xfmt = null, tipfmt = null }) {
  const W = 760, H = h, L = 62, R = 14, T = 12, B = 26, id = 'g' + (++uid);
  const all = lines.flatMap((l) => l.values.filter((v) => v != null));
  let lo = Math.min(...all), hi = Math.max(...all); if (zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const pad = (hi - lo) * 0.06 || 1; lo -= pad * (lo < 0 ? 1 : 0); hi += pad;
  const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const x = scale(0, dates.length - 1, L, W - R), y = scale(lo, hi, H - B, T);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" data-chart="${id}">`;
  ticks.forEach((t) => { s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`; });
  if (zero && lo < 0) s += `<line class="zero" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>`;
  // x ticks: ~6 labels
  const nx = Math.min(6, dates.length);
  for (let k = 0; k < nx; k++) { const i = Math.round(k * (dates.length - 1) / Math.max(1, nx - 1)); const d = dates[i]; s += `<text x="${x(i)}" y="${H - 8}" text-anchor="${k === 0 ? 'start' : k === nx - 1 ? 'end' : 'middle'}">${xfmt ? xfmt(d) : MON[+d.slice(5, 7) - 1] + ' ' + d.slice(2, 4)}</text>`; }
  lines.forEach((l, li) => {
    const pts = l.values.map((v, i) => v == null ? null : [x(i), y(v)]);
    const segs = pts.filter(Boolean);
    const p = segs.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('');
    if (area && lines.length === 1 && segs.length) {
      const base = y(Math.max(lo, 0));
      s += `<defs><linearGradient id="${id}a" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${l.color}" stop-opacity="0.22"/><stop offset="1" stop-color="${l.color}" stop-opacity="0"/></linearGradient></defs>`;
      s += `<path d="${p}L${segs[segs.length - 1][0]} ${base}L${segs[0][0]} ${base}Z" fill="url(#${id}a)"/>`;
    }
    s += `<path d="${p}" fill="none" stroke="${l.color}" stroke-width="${lines.length > 1 ? 1.7 : 2}" stroke-linejoin="round"/>`;
    const lp = segs[segs.length - 1]; if (lp) s += `<circle cx="${lp[0]}" cy="${lp[1]}" r="3.5" fill="${l.color}" stroke="var(--surface)" stroke-width="2"/>`;
  });
  s += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--fg-3)" stroke-dasharray="3 3" visibility="hidden"/>`;
  s += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/></svg>`;
  return { html: `<div class="chartbox">${s}<div class="tip" hidden></div></div>`, bind(root) {
    const box = root.querySelector(`[data-chart="${id}"]`).parentNode, svg = box.querySelector('svg'), tip = box.querySelector('.tip'), cross = svg.querySelector('.cross');
    const move = (ev) => {
      const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
      const i = Math.max(0, Math.min(dates.length - 1, Math.round((px - L) / (W - L - R) * (dates.length - 1))));
      cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
      tip.hidden = false; tip.style.left = (x(i) / W * 100) + '%'; tip.style.top = (T / H * 100 + 4) + '%';
      tip.innerHTML = (tipfmt ? tipfmt(dates[i]) : fdate(dates[i])) + lines.map((l) => l.values[i] == null ? '' : `<br><span style="color:${l.color}">●</span> ${l.name ? esc(l.name.slice(0, 22)) + ' ' : ''}${fmt(l.values[i])}`).join('');
    };
    svg.addEventListener('pointermove', move); svg.addEventListener('pointerleave', () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); });
  } };
}
function sparkline(vals, w = 110, h = 30) {
  const step = Math.max(1, Math.floor(vals.length / 80)), v = vals.filter((_, i) => i % step === 0 || i === vals.length - 1);
  const lo = Math.min(...v, 0), hi = Math.max(...v), x = scale(0, v.length - 1, 1, w - 4), y = scale(lo, hi, h - 3, 3);
  const p = v.map((q, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(q).toFixed(1)).join('');
  const c = v[v.length - 1] >= 0 ? 'var(--gain)' : 'var(--loss)';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${p}L${x(v.length - 1)} ${h - 1}L1 ${h - 1}Z" fill="${c}" opacity=".12"/><path d="${p}" fill="none" stroke="${c}" stroke-width="1.5"/><circle cx="${x(v.length - 1)}" cy="${y(v[v.length - 1])}" r="2.4" fill="${c}"/></svg>`;
}
function barChart(items, { h = 230, fmt = inrC, W = 440, rotate = false } = {}) { // items [{label, value}]
  const H = h, L = 62, R = 10, T = 18, B = rotate ? 92 : 26;
  const vals = items.map((i) => i.value); let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const ticks = niceTicks(lo, hi, 4); lo = Math.min(lo, ticks[0]); hi = Math.max(hi, ticks[ticks.length - 1]);
  const y = scale(lo, hi, H - B, T), bw = (W - L - R) / items.length;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach((t) => { s += `<line class="${t === 0 ? 'zero' : 'grid'}" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 3.5}" text-anchor="end">${fmt(t)}</text>`; });
  items.forEach((it, i) => {
    const x0 = L + i * bw + bw * 0.18, w = bw * 0.64, y0 = y(Math.max(0, it.value)), hh = Math.abs(y(it.value) - y(0));
    const c = it.value >= 0 ? 'var(--gain)' : 'var(--loss)';
    s += `<rect x="${x0}" y="${y0}" width="${w}" height="${Math.max(1, hh)}" rx="3" fill="${c}" opacity=".85"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    s += rotate ? `<text transform="translate(${x0 + w / 2} ${H - B + 12}) rotate(-40)" text-anchor="end">${esc(it.label.length > 16 ? it.label.slice(0, 15) + '…' : it.label)}</text>` : `<text x="${x0 + w / 2}" y="${H - 8}" text-anchor="middle">${esc(it.label)}</text>`;
    s += `<text x="${x0 + w / 2}" y="${it.value >= 0 ? y0 - 5 : y0 + hh + 12}" text-anchor="middle" style="fill:var(--fg-2)">${fmt(it.value)}</text>`;
  });
  return s + '</svg>';
}

// ---------- slicing ----------
const RANGES = { '1M': 31, '3M': 92, '6M': 183, '1Y': 365, 'All': 0 };
function slice(series, key) {
  if (!RANGES[key]) return series;
  const last = new Date(series[series.length - 1][0] + 'T00:00:00Z'), cut = new Date(last - RANGES[key] * 864e5).toISOString().slice(0, 10);
  let base = 0, out = [];
  for (const r of series) { if (r[0] <= cut) base = r[1]; else out.push([r[0], r[1] - base]); }
  return out.length ? out : series;
}

// ---------- views ----------
const views = {};
let sortKey = pref.sort || 'sharpe', sortDir = pref.dir || -1, filt = { q: '', ex: 'All', st: 'All' };

// ---------- shared helpers for live pages ----------
const SERVER = !!(CONFIG && CONFIG.server);
let SETTINGS = (CONFIG && CONFIG.settings) || { names: {}, hidden: [], perStrategy: {}, alerts: {}, channels: [], telegram: {} };
async function api(path, body) {
  if (!SERVER) throw new Error('Settings can only be changed in the AlgoLens app running on your computer.');
  const r = await fetch(path, body === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong (' + r.status + ').');
  return j;
}
function toast(msg, bad) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.className = bad ? 'bad' : ''; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => { t.hidden = true; }, 3500);
}
async function saveSettings(patch, okMsg) {
  try { SETTINGS = await api('api/settings', patch); if (okMsg) toast(okMsg); return true; } catch (e) { toast(e.message, true); return false; }
}
async function copyText(text, label = 'Copied') {
  try { await navigator.clipboard.writeText(text); toast(label); } catch (e) { toast('Copy failed. Select the text and copy it instead.', true); }
}
const exChips = (ex) => String(ex || '').split(/[,\s]+/).filter(Boolean).map((x) => `<span class="xchip">${esc(x)}</span>`).join('');
const styleChip = (s) => `<span class="schip ${s === 'Positional' ? 'pos' : ''}">${esc(s || 'Intraday')}</span>`;
const pctPill = (v) => `<span class="ppill ${v > 0 ? 'g' : v < 0 ? 'l' : ''}">${pct(v, 2)}</span>`;
const sgnInr = (v) => (v > 0 ? '+' : '') + inr(v);
function ddBar(now, max) {
  const w = Math.min(100, max ? now / max * 100 : 0), c = w > 66 ? 'var(--loss)' : w > 33 ? 'var(--warn)' : 'var(--gain)';
  return `<div class="ddbar" title="Drawdown now ${pct(now, 1)} of capital+peak · worst ever ${pct(max, 1)}"><span style="width:${w}%;background:${c}"></span></div><div class="ddtxt">${now.toFixed(1)}% / ${max.toFixed(1)}%</div>`;
}
const shortCode = (c) => c ? c.slice(0, 8) + '…' : '';
const tdLink = (id) => `https://tradetron.tech/deployed/view/${id}`;
function instr(p) { // OPTIDX_SENSEX_01OCT2026_PE_71500 -> SENSEX 01 Oct 26 71500 PE
  const m = /^[A-Z]+_(.+?)_(\d{2})([A-Z]{3})(\d{4})_(CE|PE|FF|XX)?_?([\d.]+)?$/.exec(p.i || '');
  if (!m) return esc((p.i || '').replace(/_/g, ' '));
  const mon = m[3][0] + m[3].slice(1).toLowerCase();
  return `${esc(m[1])} <span class="faint">${m[2]} ${mon} ${m[4].slice(2)}</span>${m[6] ? ' ' + m[6] : ''}${m[5] === 'CE' || m[5] === 'PE' ? ' ' + m[5] : m[5] === 'FF' ? ' FUT' : ''}`;
}
const openMtm = (d) => (d.positions || []).filter((p) => p.q).reduce((a, p) => a + (p.pnl || 0), 0);
const booked = (d) => (d.positions || []).filter((p) => !p.q).reduce((a, p) => a + (p.pnl || 0), 0);
function posTable(d) {
  const ps = [...(d.positions || [])].sort((a, b) => (b.q !== 0) - (a.q !== 0));
  if (!ps.length) return '<p class="muted" style="margin:8px 0 0">No positions in the current counter.</p>';
  return `<div style="overflow-x:auto"><table class="postable"><thead><tr><th>Instrument</th><th class="n">Qty</th><th class="n">Avg price</th><th class="n">LTP</th><th class="n">P&amp;L</th></tr></thead><tbody>
  ${ps.map((p) => `<tr class="${p.q ? '' : 'closed'}"><td>${instr(p)}${p.q ? '' : ' <span class="faint">closed</span>'}</td><td class="n">${p.q}</td><td class="n">${fnum(p.avg)}</td><td class="n">${fnum(p.ltp)}</td><td class="n ${sgnCls(p.pnl)}">${inr(p.pnl)}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function liveCounterPanel(id) {

  return `<section class="panel"><div class="panel-h"><h2>Today · counter #${d.ctr}</h2><span class="updated">Live ${hm(LIVE.fetchedAt)}</span></div>
    <div class="kpis" style="margin-bottom:14px">
      <div class="kpi"><div class="eyebrow">Today</div><div class="v ${sgnCls(d.today)}">${sgnInr(d.today)}</div><div class="s">${pct(d.todayPct, 2)} of capital · ${d.style}</div></div>
      <div class="kpi"><div class="eyebrow">Open / booked</div><div class="v" style="font-size:16px"><span class="${sgnCls(openMtm(d))}">${inrC(openMtm(d))}</span> / <span class="${sgnCls(booked(d))}">${inrC(booked(d))}</span></div><div class="s">${d.open} open of ${d.total} positions</div></div>
      <div class="kpi"><div class="eyebrow">Previous counters</div><div class="v" style="font-size:14px;line-height:1.7">${(d.counters || []).slice(1, 6).map(([c, v]) => `<span class="${sgnCls(v)}">${inrC(v)}</span>`).join(' · ') || '—'}</div><div class="s">#${d.ctr - 1} back to #${Math.max(1, d.ctr - 5)}</div></div>
    </div>${posTable(d)}</section>`;
}
const intradayTime = (t) => { const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')}${h < 12 ? 'am' : 'pm'}`; };

// ---------- Dashboard (Strategy Dashboard) ----------
const DCOLS = [

  { k: 'today', t: 'Today', n: 1, on: 1, v: (d) => d.today, td: (d) => `<td class="n"><b class="${sgnCls(d.today)}">${sgnInr(d.today)}</b><div class="sub" style="justify-content:flex-end">${pctPill(d.todayPct)}</div></td>`, foot: (r) => `<td class="n"><b class="${sgnCls(r.today)}">${sgnInr(r.today)}</b><div class="sub" style="justify-content:flex-end">${pctPill(r.today / r.cap * 100)}</div></td>` },
  { k: 'all', t: 'All-time', n: 1, on: 1, v: (d) => d.allTime, td: (d) => `<td class="n"><b class="${sgnCls(d.allTime)}">${sgnInr(d.allTime)}</b><div class="sub" style="justify-content:flex-end">${pctPill(d.allTimePct)}</div></td>`, foot: (r) => `<td class="n"><b class="${sgnCls(r.all)}">${sgnInr(r.all)}</b><div class="sub" style="justify-content:flex-end">${pctPill(r.all / r.cap * 100)}</div></td>` },
  { k: 'dd', t: 'Drawdown now / max', on: 1, v: (d) => d.ddNowPct, td: (d) => `<td>${ddBar(d.ddNowPct, d.ddMaxPct)}</td>`, foot: (r) => `<td>${ddBar(r.ddNow, r.ddMax)}</td>` },
  { k: 'status', t: 'Status', on: 1, td: (d) => `<td>${statusPill(d.status)}</td>` },
  { k: 'style', t: 'Type', on: 1, td: (d) => `<td>${styleChip(d.style)}</td>` },
  { k: 'pos', t: 'Positions', on: 0, v: (d) => d.open, td: (d) => `<td>${d.open ? `<b>${d.open}</b> open` : '<span class="faint">none open</span>'}<div class="sub">${d.total} in counter</div></td>` },
  { k: 'counter', t: 'Counter', on: 0, v: (d) => d.ctr, td: (d) => `<td class="mono">#${d.ctr}<div class="sub">prev <span class="${sgnCls(d.lastPnl)}">${inrC(d.lastPnl)}</span></div></td>` },
  { k: 'openmtm', t: 'Open MTM', n: 1, on: 0, v: openMtm, td: (d) => `<td class="n ${sgnCls(openMtm(d))}">${inr(openMtm(d))}</td>` },
  { k: 'booked', t: 'Booked', n: 1, on: 0, v: booked, td: (d) => `<td class="n ${sgnCls(booked(d))}">${inr(booked(d))}</td>` },
  { k: 'broker', t: 'Broker / SID', on: 0, td: (d) => `<td>${esc(d.broker)}<div class="sub mono">SID ${d.id}</div></td>` },
  { k: 'trend', t: 'Trend', on: 0, td: (d) => `<td>${byId[d.id] ? sparkline(byId[d.id].r.cum, 96, 28) : '<span class="faint">no history</span>'}</td>` },
];
const STATUS_GROUPS = [['all', 'All'], ['Live-Entered', 'In position'], ['Active', 'Waiting'], ['Paused', 'Paused'], ['Exited', 'Exited'], ['Error', 'Error']];
let dashOpen = new Set(), dashQ = '', dashStatus = 'all', trendPick = 'total', rankAll = false;

views.dashboard = (app) => {
  const cols = { ...Object.fromEntries(DCOLS.map((c) => [c.k, !!c.on])), ...(pref.cols2 || {}) };
  let sortK = pref.dsort || 'today-';
  const today = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  if (!LIVE.items.length) {
    app.innerHTML = `<section class="head view"><div><div class="eyebrow">Live</div><h1>Strategy dashboard</h1><p>No live data yet. Save your Tradetron session on the <a href="#settings">Settings</a> page; the dashboard then refreshes every ${LIVE.intervalMin || 15} minutes while AlgoLens is running.</p></div></section>`;
    return;
  }
  app.innerHTML = `
  <section class="head view"><div><div class="eyebrow">Live P&amp;L, capital and performance · ${fdate(today)}</div><h1>Strategy dashboard</h1></div>
    <div class="controls"><span class="updated"><span class="dot"></span>Updated ${hm(LIVE.fetchedAt)} · every ${LIVE.intervalMin || 15} min</span>${SERVER ? '<button class="btn" id="refreshNow">Refresh now</button>' : ''}</div></section>
  <nav class="goto" aria-label="Go to section"><span class="eyebrow">Go to</span><a href="#trendSec" data-jump>Intraday trend</a><a href="#breakSec" data-jump>Strategy breakdown</a><a href="#rankSec" data-jump>Top performers</a></nav>
  <section class="kpis" id="dk"></section>
  <details class="panel" id="trendSec" ${pref.trendClosed ? '' : 'open'}><summary><h2>Intraday P&amp;L trend</h2><span class="faint" style="font-size:12px">Recorded at every refresh during market hours</span></summary>
    <div class="controls" style="margin:12px 0 4px"><select id="trendPick" class="field" aria-label="Series"></select></div><div id="trend"></div></details>
  <section id="breakSec">
    <div class="panel-h" style="margin-top:4px"><div><h2>Strategy breakdown</h2><p class="faint" style="margin:2px 0 0;font-size:12.5px">Click a row for positions. The copy button copies a strategy's share code.</p></div>
      <div class="controls">
        <input id="dq" class="field" type="search" placeholder="Filter name, creator, broker or SID" aria-label="Filter" value="${esc(dashQ)}" style="width:min(260px,100%)">
        <select id="dsort" class="field" aria-label="Sort">${[['today-', 'Today, high to low'], ['today+', 'Today, low to high'], ['all-', 'All-time, high to low'], ['cap-', 'Capital, high to low'], ['dd-', 'Deepest drawdown now'], ['order', 'Tradetron order'], ['name', 'Name']].map(([k, t]) => `<option value="${k}" ${k === sortK ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button class="btn" id="dexp">${dashOpen.size ? 'Collapse all' : 'Expand all'}</button>
        <div class="colpick"><button class="btn" id="colbtn" aria-expanded="false">Columns</button>
          <div class="colpick-menu" id="colmenu" hidden>${DCOLS.map((c) => `<label><input type="checkbox" data-col="${c.k}" ${cols[c.k] ? 'checked' : ''}>${c.t}</label>`).join('')}</div></div>
      </div></div>
    <div class="statchips" id="dstat"></div>
    <div class="tablewrap" style="margin-top:12px"><table class="dash" id="dt"></table></div>
  </section>
  <section class="panel" id="rankSec"><div class="panel-h"><div><h2>Top performers</h2><p class="faint" style="margin:2px 0 0;font-size:12.5px">Ranked by average monthly return on capital, at the deployed multiplier</p></div><div class="controls"><span class="ppill g" id="pfavg"></span><button class="btn" id="rankAll"></button></div></div><div id="rank"></div></section>`;
  const visible = () => LIVE.items.filter(srcMatch);
  function drawTrend() {
    const snaps = (INTRADAY && INTRADAY.snaps) || [];
    const items = visible();
    $('#trendPick').innerHTML = `<option value="total">Portfolio total (${items.length})</option>` + items.map((d) => `<option value="${d.id}" ${String(trendPick) === String(d.id) ? 'selected' : ''}>${esc(d.name)}</option>`).join('');
    if (snaps.length < 2) { $('#trend').innerHTML = `<p class="muted">The curve builds up during the day, one point per refresh${snaps.length ? ' (1 so far)' : ''}. It starts at the first refresh after 9:00 am.</p>`; return; }
    const ids = new Set(items.map((d) => d.id));
    const vals = snaps.map((s) => trendPick === 'total' ? Object.entries(s.byId || {}).reduce((a, [id, v]) => a + (ids.has(+id) ? v : 0), 0) : (s.byId || {})[trendPick] ?? null);
    const c = lineChart({ dates: snaps.map((s) => s.t), lines: [{ values: vals, color: vals.at(-1) >= 0 ? 'var(--gain)' : 'var(--loss)' }], h: 230, xfmt: intradayTime, tipfmt: intradayTime });
    $('#trend').innerHTML = c.html; c.bind($('#trend'));
  }
  function drawRank() {
    const rows = visible().filter((d) => d.avgMonthlyRoiPct != null).sort((a, b) => b.avgMonthlyRoiPct - a.avgMonthlyRoiPct);
    const capSum = rows.reduce((a, d) => a + d.cap, 0);
    const avg = capSum ? rows.reduce((a, d) => a + d.avgMonthlyRoiPct * d.cap, 0) / capSum : 0;
    $('#pfavg').textContent = `Portfolio avg ${pct(avg, 2)} / month`;
    const shown = rankAll ? rows : rows.slice(0, 15);
    $('#rankAll').hidden = rows.length <= 15; $('#rankAll').textContent = rankAll ? 'Show top 15' : `Show all ${rows.length}`;
    $('#rank').innerHTML = shown.length ? `<div style="overflow-x:auto">${barChart(shown.map((d) => ({ label: d.name, value: d.avgMonthlyRoiPct })), { W: Math.max(760, shown.length * 46), h: 300, fmt: (v) => v.toFixed(1) + '%', rotate: true })}</div>` : '<p class="muted">Rankings appear once performance history has been collected.</p>';
  }
  function draw() {
    const items = visible();
    const tot = { cap: items.reduce((a, d) => a + d.cap, 0), today: items.reduce((a, d) => a + d.today, 0), all: items.reduce((a, d) => a + d.allTime, 0) };
    tot.ddNow = tot.cap ? items.reduce((a, d) => a + d.ddNowPct * d.cap, 0) / tot.cap : 0;
    tot.ddMax = tot.cap ? items.reduce((a, d) => a + d.ddMaxPct * d.cap, 0) / tot.cap : 0;
    const openPos = items.reduce((a, d) => a + (d.positions || []).filter((p) => p.q).length, 0), inPos = items.filter((d) => d.open > 0).length;
    const up = items.filter((d) => d.today > 0).length, down = items.filter((d) => d.today < 0).length;
    $('#dk').innerHTML = `
      <div class="kpi"><div class="eyebrow">Deployed capital</div><div class="v">${inrC(tot.cap)}</div><div class="s">across ${items.length} strategies</div></div>
      <div class="kpi"><div class="eyebrow">Today</div><div class="v ${sgnCls(tot.today)}">${sgnInr(tot.today)}</div><div class="s">${pct(tot.today / Math.max(1, tot.cap) * 100, 2)} · ${up} up, ${down} down</div></div>
      <div class="kpi"><div class="eyebrow">All-time</div><div class="v ${sgnCls(tot.all)}">${inrC(tot.all)}</div><div class="s">${pct(tot.all / Math.max(1, tot.cap) * 100, 1)} of capital</div></div>
      <div class="kpi"><div class="eyebrow">Open positions</div><div class="v">${openPos}</div><div class="s">${inPos} strategies in a position</div></div>`;
    const cnt = (k) => k === 'all' ? items.length : items.filter((d) => k === 'Error' ? /error|block/i.test(d.status) : d.status === k).length;
    $('#dstat').innerHTML = STATUS_GROUPS.filter(([k]) => k === 'all' || cnt(k)).map(([k, t]) => `<button data-st="${k}" aria-pressed="${dashStatus === k}">${t} <span class="mono">${cnt(k)}</span></button>`).join('');
    const q = dashQ.toLowerCase();
    let rows = items.filter((d) => (dashStatus === 'all' || (dashStatus === 'Error' ? /error|block/i.test(d.status) : d.status === dashStatus)) && (!q || `${d.name} ${d.tdName} ${d.creator} ${d.broker} ${d.id}`.toLowerCase().includes(q)));
    const col = DCOLS.find((c) => c.k === sortK.replace(/[-+]$/, ''));
    if (sortK === 'name') rows.sort((a, b) => a.name.localeCompare(b.name));
    else if (col && col.v) { const dir = sortK.endsWith('+') ? 1 : -1; rows.sort((a, b) => ((col.v(a) ?? -Infinity) - (col.v(b) ?? -Infinity)) * dir); }
    const shown = DCOLS.filter((c) => cols[c.k]);
    $('#dt').innerHTML = `<thead><tr><th>Strategy</th>${shown.map((c) => `<th class="${c.n ? 'n' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>${rows.map((d) => `
      <tr class="main click ${dashOpen.has(d.id) ? 'open' : ''}" data-id="${d.id}" tabindex="0" aria-expanded="${dashOpen.has(d.id)}">
        <td style="white-space:normal;min-width:230px"><div style="display:flex;gap:6px;align-items:baseline"><span class="chev">▸</span><span class="sname" style="white-space:normal">${esc(d.name)}</span><span class="mchip">${d.mult}x</span></div>
          <div class="sub">${esc(d.broker)} · ${exChips(d.ex)}<span class="src ${srcOf(d)}">${srcOf(d) === 'own' ? 'Mine' : 'Shared'}</span></div>
          <div class="sub">Since ${fdate(d.on)} (${d.sinceDays} days)${d.shareCode ? ` · <button class="copy" data-code="${esc(d.shareCode)}" title="Copy share code">Copy code</button>` : ''}</div></td>
        ${shown.map((c) => c.td(d)).join('')}</tr>
      ${dashOpen.has(d.id) ? `<tr class="posrow"><td colspan="${shown.length + 1}"><div class="links" style="margin:2px 0 8px">${byId[d.id] ? `<a href="#s${d.id}">Full performance report</a>` : ''}<a href="${tdLink(d.id)}" target="_blank" rel="noopener">Open in Tradetron ↗</a><span class="faint" style="font-size:12px">Counter #${d.ctr} · ${d.open} open of ${d.total} positions · SID ${d.id}</span></div>${posTable(d)}</td></tr>` : ''}`).join('') || `<tr><td colspan="${shown.length + 1}" class="muted" style="padding:28px;text-align:center">No strategies match.</td></tr>`}</tbody>
      ${rows.length ? `<tfoot><tr><td><b>Total</b><div class="sub">${items.length} strategies</div></td>${shown.map((c) => c.foot ? c.foot(tot) : '<td></td>').join('')}</tr></tfoot>` : ''}`;
    $('#dexp').textContent = dashOpen.size ? 'Collapse all' : 'Expand all';
  }
  draw(); drawTrend(); drawRank();
  views.dashboard.redraw = () => { draw(); drawTrend(); drawRank(); };
  app.querySelectorAll('[data-jump]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); const t = $(a.getAttribute('href')); if (t.tagName === 'DETAILS') t.open = true; t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }));
  $('#trendSec').addEventListener('toggle', (e) => { pref.trendClosed = !e.target.open; save(); });
  $('#trendPick').addEventListener('change', (e) => { trendPick = e.target.value === 'total' ? 'total' : +e.target.value; drawTrend(); });
  $('#rankAll').addEventListener('click', () => { rankAll = !rankAll; drawRank(); });
  $('#dq').addEventListener('input', (e) => { dashQ = e.target.value; draw(); });
  $('#dsort').addEventListener('change', (e) => { sortK = e.target.value; pref.dsort = sortK; save(); draw(); });
  $('#dstat').addEventListener('click', (e) => { const b = e.target.closest('button[data-st]'); if (b) { dashStatus = b.dataset.st; draw(); } });
  $('#dexp').addEventListener('click', () => { if (dashOpen.size) dashOpen.clear(); else visible().forEach((d) => dashOpen.add(d.id)); draw(); });
  const toggle = (tr) => { const id = +tr.dataset.id; dashOpen.has(id) ? dashOpen.delete(id) : dashOpen.add(id); draw(); };
  $('#dt').addEventListener('click', (e) => { const cp = e.target.closest('.copy'); if (cp) { e.stopPropagation(); return copyText(cp.dataset.code, 'Share code copied. Add it under Shared Codes in Tradetron.'); } if (e.target.closest('a')) return; const tr = e.target.closest('tr.main'); if (tr) toggle(tr); });
  $('#dt').addEventListener('keydown', (e) => { const tr = e.target.closest('tr.main'); if (tr && e.target === tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggle(tr); } });
  $('#colbtn').addEventListener('click', () => { const m = $('#colmenu'); m.hidden = !m.hidden; $('#colbtn').setAttribute('aria-expanded', !m.hidden); });
  $('#colmenu').addEventListener('change', (e) => { const k = e.target.dataset.col; cols[k] = e.target.checked; pref.cols2 = cols; save(); draw(); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.colpick')) { const m = $('#colmenu'); if (m) m.hidden = true; } });
  if ($('#refreshNow')) $('#refreshNow').addEventListener('click', async (e) => { e.target.disabled = true; e.target.textContent = 'Refreshing…'; try { await api('api/refresh', {}); await pollLive(true); toast('Live data refreshed'); } catch (err) { toast(err.message, true); } e.target.disabled = false; e.target.textContent = 'Refresh now'; });
};

// ---------- Monitor (strategy cards with alert toggles) ----------
let monQ = '';
views.monitor = (app) => {
  const items = LIVE.items.filter(srcMatch), removed = (LIVE.removed || []).filter(srcMatch);
  if (!items.length && !removed.length) { app.innerHTML = `<section class="head view"><div><h1>Strategies</h1><p>No live data yet. Save your Tradetron session on the <a href="#settings">Settings</a> page.</p></div></section>`; return; }
  app.innerHTML = `
  <section class="head view"><div><div class="eyebrow">Monitoring</div><h1>Strategies</h1><p>${items.length} strategies monitored. Switch error and P&amp;L alerts per strategy.</p></div>
    <span class="updated">Last fetched ${hm(LIVE.fetchedAt)}</span></section>

  <div class="controls"><input id="mq" class="field" type="search" placeholder="Search strategies" aria-label="Search strategies" value="${esc(monQ)}" style="width:min(320px,100%)"></div>
  <section class="cards" id="mc"></section>`;
  function draw() {
    const all = LIVE.items.filter(srcMatch);
    const today = all.reduce((a, d) => a + d.today, 0);
    const errOn = all.filter((d) => d.alerts.error).length, pnlOn = all.filter((d) => d.alerts.pnl).length;
    $('#mk').innerHTML = `
      <div class="kpi"><div class="eyebrow">Today's P&amp;L</div><div class="v ${sgnCls(today)}">${sgnInr(today)}</div><div class="s">across ${all.length} strategies</div></div>
      <div class="kpi"><div class="eyebrow">Error alerts</div><div class="v">${errOn} <span class="faint" style="font-size:14px">/ ${all.length}</span></div><div class="s">${SETTINGS.alerts?.errors === false ? 'Turned off on the Alerts page' : 'sent the moment a strategy errors'}</div></div>
      <div class="kpi"><div class="eyebrow">P&amp;L alerts</div><div class="v">${pnlOn} <span class="faint" style="font-size:14px">/ ${all.length}</span></div><div class="s">every ${SETTINGS.alerts?.intervalMin || 30} min in market hours</div></div>
      <div class="kpi"><div class="eyebrow">Channels</div><div class="v">${(SETTINGS.channels || []).length}</div><div class="s">${(SETTINGS.channels || []).length ? 'receiving alerts' : '<a href="#settings">Connect Telegram</a>'}</div></div>`;
    const q = monQ.toLowerCase();
    const card = (d) => `<article class="scard">
      <div class="chips">${exChips(d.ex)}${styleChip(d.style)}<span class="grow"></span><span class="mchip">${d.mult}x</span><span class="capchip">Cap ${inrC(d.cap)}</span></div>
      <div class="faint" style="font-size:12px;margin-top:6px">${esc(d.broker)} · <span class="src ${srcOf(d)}" style="margin:0">${srcOf(d) === 'own' ? 'Mine' : 'Shared'}</span></div>
      <h3 title="${esc(d.tdName)}">${byId[d.id] ? `<a href="#s${d.id}">${esc(d.name)}</a>` : esc(d.name)}</h3>
      <div class="pnlbox"><div><div class="eyebrow">Today</div><div class="big ${sgnCls(d.today)}">${sgnInr(d.today)}</div></div><div style="text-align:right"><div class="eyebrow">All-time</div><div class="${sgnCls(d.allTime)} mono" style="font-weight:600">${sgnInr(d.allTime)}</div></div></div>
      <div class="cardfoot"><div class="ids">${d.shareCode ? `<button class="copy mono" data-code="${esc(d.shareCode)}" title="Copy share code">${shortCode(d.shareCode)}</button><br>` : ''}<span class="mono faint">SID ${d.id}</span></div>
        <label class="sw err"><input type="checkbox" data-alert="error" data-id="${d.id}" ${d.alerts.error ? 'checked' : ''} ${SERVER ? '' : 'disabled'}><span></span>Error</label>
        <label class="sw"><input type="checkbox" data-alert="pnl" data-id="${d.id}" ${d.alerts.pnl ? 'checked' : ''} ${SERVER ? '' : 'disabled'}><span></span>P&amp;L</label></div>
      <div class="stline">${statusPill(d.status)}<a href="${tdLink(d.id)}" target="_blank" rel="noopener" class="faint" style="font-size:12px">Tradetron ↗</a></div></article>`;

      <h3><s>${esc(r.name)}</s></h3><p class="faint" style="font-size:12px;margin:0">Last seen ${r.at ? new Date(r.at).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : ''} · SID ${r.id}</p></article>`;
    $('#mc').innerHTML = [...all.filter((d) => !q || `${d.name} ${d.tdName} ${d.creator} ${d.id}`.toLowerCase().includes(q)).map(card), ...removed.filter((r) => !q || r.name.toLowerCase().includes(q)).map(rcard)].join('') || '<p class="muted">No strategies match.</p>';
  }
  draw();
  views.monitor.redraw = draw;
  $('#mq').addEventListener('input', (e) => { monQ = e.target.value; draw(); });

    const t = e.target.closest('input[data-alert]'); if (!t) return;
    const id = +t.dataset.id, kind = t.dataset.alert;
    if (await saveSettings({ perStrategy: { [id]: { [kind]: t.checked } } }, `${kind === 'pnl' ? 'P&L' : 'Error'} alerts ${t.checked ? 'on' : 'off'}`)) { const d = LIVE.items.find((x) => x.id === id); if (d) d.alerts[kind] = t.checked; draw(); }
    else t.checked = !t.checked;
  });
};

// ---------- Alerts (P&L alerts & digest) ----------
function tgToHtml(text) { // render a Telegram HTML message for the preview bubble
  return esc(text).replace(/&lt;(\/?)(b|i)&gt;/g, '<$1$2>').replace(/&lt;a href=&quot;(.*?)&quot;&gt;(.*?)&lt;\/a&gt;/g, '<a href="$1" target="_blank" rel="noopener">$2</a>').replace(/&amp;(lt|gt|amp);/g, '&$1;').replace(/\n/g, '<br>');
}
views.alerts = (app) => {
  const a = { ...SETTINGS.alerts };
  const items = LIVE.items;
  const pnlOn = items.filter((d) => d.alerts.pnl).length;
  const intra = items.filter((d) => d.style !== 'Positional').length, posi = items.length - intra;
  const chans = SETTINGS.channels || [];
  const sw = (k, label, help) => `<div class="setrow"><div><b>${label}</b><p>${help}</p></div><label class="sw big"><input type="checkbox" data-a="${k}" ${a[k] ? 'checked' : ''} ${SERVER ? '' : 'disabled'}><span></span><span class="sr">${label}</span></label></div>`;
  app.innerHTML = `
  <section class="head view"><div><div class="eyebrow">Telegram &amp; Discord</div><h1>P&amp;L alerts &amp; digest <span class="pill ${a.enabled ? 'live' : 'paused'}" style="vertical-align:middle;font-size:13px">${a.enabled ? 'Tracking active' : 'Paused'}</span></h1>

};

function heatmap(r, capital) {
  const years = Object.keys(r.yearly).sort().reverse();
  const maxAbs = Math.max(...Object.values(r.monthly).map((v) => Math.abs(v / capital * 100)), 1);
  const cell = (v) => {
    if (v == null) return `<td class="faint">·</td>`;
    const p = v / capital * 100, a = Math.min(1, Math.abs(p) / maxAbs) * 0.85 + 0.08;
    const bg = `color-mix(in srgb, ${p >= 0 ? 'var(--gain)' : 'var(--loss)'} ${Math.round(a * 100)}%, var(--surface))`;
    return `<td style="background:${bg};color:${a > 0.55 ? 'var(--surface)' : 'var(--fg)'}" title="${inr(v)}">${p.toFixed(1)}</td>`;
  };
  return `<div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>${MON.map((m) => `<th class="eyebrow">${m}</th>`).join('')}<th class="eyebrow">Year</th></tr></thead><tbody>
  ${years.map((y) => `<tr><th class="y">${y}</th>${MON.map((_, i) => cell(r.monthly[`${y}-${String(i + 1).padStart(2, '0')}`])).join('')}<td class="tot ${sgnCls(r.yearly[y])}">${(r.yearly[y] / capital * 100).toFixed(1)}</td></tr>`).join('')}
  </tbody></table></div><p class="faint" style="font-size:12px;margin:8px 0 0">Monthly return as % of deployed capital. Hover a cell for the rupee amount.</p>`;
}

views.compare = (app) => {

  function draw() {
    const items = sel.map((id) => byId[id]);

      const i0 = s.series.findIndex((r) => r[0] >= latestStart), b = i0 > 0 ? s.series[i0 - 1][1] : 0; // rebase to the common start
      return s.series.slice(i0).map((r) => [r[0], r[1] - b]);
    });
    const dates = [...new Set(sliced.flat().map((r) => r[0]))].sort();
    const lines = items.map((s, i) => { const m = new Map(sliced[i].map((r) => [r[0], r[1]])); let last = null; return { name: s.name, color: COLORS[i], values: dates.map((d) => { if (m.has(d)) last = m.get(d) / s.cap * 100; return last; }) }; });

};

function corrTable(items, series) {
  if (items.length < 2) return '<p class="muted">Pick two or more strategies to see how their daily results move together.</p>';
  const short = (s) => esc(s.name.length > 16 ? s.name.slice(0, 15) + '…' : s.name);
  return `<div style="overflow-x:auto"><table class="corr"><thead><tr><th></th>${items.map((s) => `<th class="n">${short(s)}</th>`).join('')}</tr></thead><tbody>${items.map((a, i) => `<tr><th style="text-transform:none;letter-spacing:0;font-size:12px;color:var(--fg-2)">${short(a)}</th>${items.map((b, j) => {
    if (i === j) return '<td class="faint">1.00</td>';
    const c = A.correlation(series[i], series[j]); if (c == null) return '<td class="faint">—</td>';
    const bg = `color-mix(in srgb, ${c > 0 ? 'var(--warn)' : 'var(--accent)'} ${Math.round(Math.abs(c) * 55)}%, var(--surface))`;
    return `<td style="background:${bg}">${c.toFixed(2)}</td>`; }).join('')}</tr>`).join('')}</tbody></table></div>`;
}

  app.innerHTML = `
  <section class="head view"><div><div class="eyebrow">What if I ran these together?</div><h1>Portfolio builder</h1><p>Tick strategies and set a multiplier for each. The combined curve adds their daily P&amp;L, from the date the newest pick went live, so you see real overlap and offsetting days.</p></div></section>
  <section class="pick" id="ppick">${S.map((s) => `<label><input type="checkbox" value="${s.id}" ${w[s.id] ? 'checked' : ''}><span class="pn" title="${esc(s.name)}">${esc(s.name)}</span><input type="number" class="field" min="0.5" step="0.5" value="${w[s.id] || 1}" aria-label="Multiplier for ${esc(s.name)}" data-m="${s.id}">×</label>`).join('')}</section>
  <section class="kpis" id="pk"></section>
  <section class="panel"><div class="panel-h"><h2>Combined equity</h2><span class="faint" id="pnote" style="font-size:12px"></span></div><div id="pchart"></div></section>
  <section class="grid2"><div class="panel"><div class="panel-h"><h2>Combined drawdown</h2></div><div id="pdd"></div></div>
  <div class="panel"><div class="panel-h"><h2>Correlation</h2></div><div id="pcorr"></div></div></section>
  <section class="panel"><div class="panel-h"><h2>Monthly returns</h2></div><div id="pheat"></div></section>`;
  function draw() {
    const ids = Object.keys(w).map(Number).filter((id) => byId[id] && w[id] > 0);
    if (!ids.length) { $('#pk').innerHTML = ''; $('#pchart').innerHTML = '<p class="muted">Tick at least one strategy.</p>'; $('#pdd').innerHTML = $('#pcorr').innerHTML = $('#pheat').innerHTML = ''; return; }
    const start = ids.map((id) => byId[id].series[0][0]).sort().pop();
    const parts = ids.map((id) => { const s = byId[id]; const i0 = s.series.findIndex((r) => r[0] >= start); const b = i0 > 0 ? s.series[i0 - 1][1] : 0; return { series: s.series.slice(i0).map((r) => [r[0], r[1] - b]), capital: s.cap, weight: w[id] }; });
    const comb = A.combine(parts), r = A.analyze(comb.series, comb.capital);
    const sumMaxDD = ids.reduce((a, id, k) => a + A.analyze(parts[k].series, byId[id].cap).maxDD * w[id], 0);
    $('#pk').innerHTML = `
      <div class="kpi"><div class="eyebrow">Capital needed</div><div class="v">${inrC(comb.capital)}</div><div class="s">${ids.length} strategies</div></div>
      <div class="kpi"><div class="eyebrow">Combined P&amp;L</div><div class="v ${sgnCls(r.totalPnl)}">${inrC(r.totalPnl)}</div><div class="s">${pct(r.annualReturnPct)} a year</div></div>
      <div class="kpi"><div class="eyebrow">Max drawdown</div><div class="v loss">${inrC(-r.maxDD)}</div><div class="s">${pct(-r.maxDDCapPct, 2)} of capital</div></div>
      <div class="kpi"><div class="eyebrow">Diversification</div><div class="v gain">${pct((1 - r.maxDD / Math.max(1, sumMaxDD)) * 100, 0)}</div><div class="s">smaller DD than the parts' total</div></div>
      <div class="kpi"><div class="eyebrow">Sharpe</div><div class="v">${fnum(r.sharpe)}</div><div class="s">Win days ${pct(r.winRatePct)}</div></div>`;
    const c = lineChart({ dates: r.dates, lines: [{ values: r.cum, color: 'var(--accent)' }] }); $('#pchart').innerHTML = c.html; c.bind($('#pchart'));
    $('#pnote').textContent = `${fdate(r.start)} – ${fdate(r.end)}`;
    const d = lineChart({ dates: r.dates, lines: [{ values: r.ddSeries, color: 'var(--loss)' }], h: 170, fmt: (v) => v.toFixed(1) + '%' }); $('#pdd').innerHTML = d.html; d.bind($('#pdd'));
    $('#pcorr').innerHTML = corrTable(ids.map((id) => byId[id]), parts.map((p) => p.series));
    $('#pheat').innerHTML = heatmap(r, comb.capital);
  }
  draw();
  $('#ppick').addEventListener('change', (e) => {
    const t = e.target, lab = t.closest('label'), id = +(t.value && t.type === 'checkbox' ? t.value : t.dataset.m);
    const cb = lab.querySelector('input[type=checkbox]'), m = lab.querySelector('input[type=number]');
    if (cb.checked) w[id] = Math.max(0.5, +m.value || 1); else delete w[id];
    pref.pw = w; save(); draw();
  });
};

// ---------- router ----------
let currentKey = '';
function route(keepScroll) {
  const h = location.hash.slice(1) || 'dashboard', app = $('#app');
  const m = h.match(/^s(\d+)$/);
  const key = m ? 'overview' : (views[h] ? h : 'dashboard');
  currentKey = m ? 'strategy' : key;
  document.querySelectorAll('.nav a').forEach((a) => { if (a.dataset.v === key && !m) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const y = window.scrollY;
  if (m) views.strategy(app, +m[1]); else views[key](app);
  window.scrollTo(0, keepScroll === true ? y : 0);
}
addEventListener('hashchange', () => route()); route();

// Pick up new live data from the server without reloading (when served by AlgoLens on your computer)
async function pollLive(force) {
  try {
    const r = await fetch('api/live', { cache: 'no-store' }); if (!r.ok) return;
    const j = await r.json();
    const changed = force || j.live.fetchedAt !== LIVE.fetchedAt || j.sync.ok !== SYNC.ok || (j.intraday.snaps || []).length !== (INTRADAY.snaps || []).length;
    if (!changed) return;
    LIVE = j.live; INTRADAY = j.intraday; SYNC = { ...SYNC, ...j.sync }; drawSrcSeg(); drawSyncTxt();
    if (currentKey === 'dashboard' && views.dashboard.redraw && $('#dt')) views.dashboard.redraw();
    if (currentKey === 'monitor' && views.monitor.redraw && $('#mc')) views.monitor.redraw();
  } catch (e) {}
}
if (SERVER) setInterval(pollLive, 60000);
})();
</script>
